; Keeps `php artisan queue:work` running continuously so queued email (and
; any other queued job) actually gets processed once QUEUE_CONNECTION is
; switched to "database" - without this, jobs will sit in the `jobs` table
; forever and every email will stay stuck at "pending" in Admin > Monitoring
; Email.
;
; Install on the app server:
;   sudo cp deploy/supervisor-queue-worker.conf /etc/supervisor/conf.d/aspro-queue-worker.conf
;   # edit the two "REPLACE_WITH_APP_PATH" placeholders below first
;   sudo supervisorctl reread
;   sudo supervisorctl update
;   sudo supervisorctl start aspro-queue-worker:*
;
; After deploying new code, restart the workers so they pick it up
; (they keep the old code loaded in memory otherwise):
;   php artisan queue:restart

[program:aspro-queue-worker]
process_name=%(program_name)s_%(process_num)02d
command=php REPLACE_WITH_APP_PATH/artisan queue:work database --sleep=3 --tries=3 --max-time=3600
directory=REPLACE_WITH_APP_PATH
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=REPLACE_WITH_APP_PATH/storage/logs/queue-worker.log
stopwaitsecs=3600
